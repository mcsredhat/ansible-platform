---
name: ci
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ansible-lint yamllint
      - run: yamllint .
      - run: ansible-lint
  molecule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "molecule-plugins[podman]" molecule ansible-core
      - run: ansible-galaxy collection install -r requirements.yml
      - run: cd roles/base && molecule test
