---
# wordpress role — the WordPress app on the web tier (00-architecture §4.4)
# Reconciled from web1/web2 manual builds (docs/reference/web-tier-ansible-mapping.md)
wp_path: /var/www/wordpress
wp_cli_url: "https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar"
wp_cli_bin: "php -d memory_limit=512M /usr/local/bin/wp"

# Site identity (behind the TLS edge; emit https URLs)
wp_site_url: "https://app.platform.lab"
wp_title: "Platform Lab"
wp_server_name: "app.platform.lab _"
wp_backend_port: 8080

# Database (data1) — password comes from vault_mariadb_wp_pw
wp_db_name: wordpress
wp_db_user: wp_user
wp_db_host: "data1"

# Redis object cache (Predis client; password from vault_redis_pw)
wp_redis_host: "data1"
wp_redis_port: 6379

# Admin (password from vault_wp_admin_pw)
wp_admin_user: admin
wp_admin_email: "admin@platform.lab"
