---
role_name_check: 1
dependency:
  name: galaxy
  options:
    requirements-file: ../../../../requirements.yml
driver:
  name: podman
platforms:
- name: audit-el9
  image: quay.io/rockylinux/rockylinux:9
  command: /usr/sbin/init
  systemd: always
  privileged: true
  volumes:
  - /sys/fs/cgroup:/sys/fs/cgroup:rw
  cgroupns_mode: host
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        audit_aide_init: false
        audit_openscap: false
  env:
    ANSIBLE_ROLES_PATH: ../../../../roles
verifier:
  name: ansible
