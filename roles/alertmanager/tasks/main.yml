---
# alertmanager — pinned binary + systemd, local receiver (email stubbed for Phase 6)

- name: Detect container runtime
  ansible.builtin.set_fact:
    alertmanager_in_container: "{{ ansible_facts['virtualization_type'] | default('') in
      ['docker', 'podman', 'container', 'lxc', 'containerd', 'oci'] }}"
  tags: always

- name: Create the alertmanager system user
  ansible.builtin.user:
    name: "{{ alertmanager_user }}"
    system: true
    shell: /sbin/nologin
    home: "{{ alertmanager_data_dir }}"
    create_home: false
  tags: [alertmanager, user]

- name: Create alertmanager directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ alertmanager_user }}"
    group: "{{ alertmanager_user }}"
    mode: "0755"
  loop:
    - "{{ alertmanager_config_dir }}"
    - "{{ alertmanager_data_dir }}"
  tags: [alertmanager, config]

- name: Download and extract alertmanager
  ansible.builtin.unarchive:
    src: "{{ alertmanager_download_url }}"
    dest: /tmp
    remote_src: true
    creates: "/tmp/alertmanager-{{ alertmanager_version }}.{{ alertmanager_arch }}/alertmanager"
  tags: [alertmanager, install]

- name: Install alertmanager binaries
  ansible.builtin.copy:
    src: "/tmp/alertmanager-{{ alertmanager_version }}.{{ alertmanager_arch }}/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  loop:
    - alertmanager
    - amtool
  notify: restart alertmanager
  tags: [alertmanager, install]

- name: Deploy the alertmanager configuration
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: "{{ alertmanager_config_dir }}/alertmanager.yml"
    owner: "{{ alertmanager_user }}"
    group: "{{ alertmanager_user }}"
    mode: "0644"
    validate: "/usr/local/bin/amtool check-config %s"
  notify: restart alertmanager
  tags: [alertmanager, config]

- name: Deploy the alertmanager systemd unit
  ansible.builtin.template:
    src: alertmanager.service.j2
    dest: /etc/systemd/system/alertmanager.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart alertmanager
  tags: [alertmanager, service]

- name: Enable and start alertmanager
  ansible.builtin.systemd:
    name: alertmanager
    state: started
    enabled: true
    daemon_reload: true
  when: not alertmanager_in_container
  tags: [alertmanager, service]

- name: Is firewalld running?
  ansible.builtin.command: systemctl is-active firewalld
  register: alertmanager_firewalld
  changed_when: false
  failed_when: false
  tags: [alertmanager, firewall]

- name: Allow the mgmt subnet to reach the Alertmanager UI
  ansible.posix.firewalld:
    rich_rule: "rule family=ipv4 source address={{ alertmanager_allowed_source }} port port={{ alertmanager_port }} protocol=tcp accept"
    permanent: true
    immediate: "{{ alertmanager_firewalld.stdout == 'active' }}"
    state: enabled
  when: not alertmanager_in_container
  tags: [alertmanager, firewall]
