---
# mail_postfix — Postfix MTA with PostgreSQL virtual lookups (Phase 7b)
mail_postfix_packages:
  - postfix
  - postfix-pgsql
  - cyrus-sasl
  - cyrus-sasl-plain
mail_domain: "{{ domain }}"                       # platform.lab
mail_hostname: "mail.{{ mail_domain }}"           # mail.platform.lab
mail_pg_db: mailserver
mail_pg_user: mailuser
mail_pg_password: "{{ vault_mail_pg_password }}"
mail_pg_host: "127.0.0.1"

# Virtual mailbox storage
mail_vmail_user: vmail
mail_vmail_uid: 5000
mail_vmail_group: vmail
mail_vmail_gid: 5000
mail_vmail_home: /var/mail/vhosts

# Networks allowed to relay (the lab subnet); everything else must authenticate
mail_mynetworks: "127.0.0.0/8 [::1]/128 192.168.1.0/24"

# TLS (self-signed for the lab; real certs come with the public domain later)
mail_tls_cert: /etc/pki/tls/certs/mail.crt
mail_tls_key: /etc/pki/tls/private/mail.key
