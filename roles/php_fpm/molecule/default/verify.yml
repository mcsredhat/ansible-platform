---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: php cli present
      ansible.builtin.command: php -v
      changed_when: false
    - name: core extensions present
      ansible.builtin.command: php -m
      register: mods
      changed_when: false
    - name: Assert required PHP extensions are loaded
      ansible.builtin.assert:
        that:
          - "'mysqlnd' in mods.stdout"
          - "'opcache' in (mods.stdout | lower)"
        fail_msg: "Expected extensions not loaded. Loaded: {{ mods.stdout_lines }}"
