---
role_name_check: 1
dependency:
  name: galaxy
  options:
    requirements-file: ../../../../requirements.yml
driver:
  name: podman
platforms:
  - name: phpfpm-el9
    image: quay.io/rockylinux/rockylinux:9
    command: /usr/sbin/init
    systemd: always
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
provisioner:
  name: ansible
  inventory:
    host_vars:
      phpfpm-el9:
        php_pool_user: nginx
        php_pool_group: nginx
        php_listen_owner: nginx
  playbooks:
    prepare: prepare.yml
  env:
    ANSIBLE_ROLES_PATH: ../../../../roles
verifier:
  name: ansible
