---
- name: Prepare
  hosts: all
  gather_facts: false
  become: false
  tasks:
    - name: Install sudo
      ansible.builtin.raw: dnf -y install sudo
      changed_when: false
    - name: Enable EPEL + CRB (best effort)
      ansible.builtin.raw: sh -c 'dnf -y install epel-release dnf-plugins-core || true; dnf config-manager --set-enabled crb || true; exit 0'
      changed_when: false
    - name: Install PyMySQL + mariadb-server
      ansible.builtin.raw: dnf -y install python3-PyMySQL mariadb-server
      changed_when: false
    - name: Initialize + start mariadb so the exporter's DB-user task can connect
      ansible.builtin.raw: sh -c 'mariadb-install-db --user=mysql >/dev/null 2>&1 || true; mysqld_safe --nowatch >/dev/null 2>&1 & sleep 5; exit 0'
      changed_when: false
