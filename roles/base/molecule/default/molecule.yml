---
role_name_check: 1
dependency:
  name: galaxy
  options:
    requirements-file: ../../../../requirements.yml
driver:
  name: podman
platforms:
  - name: base-el9
    image: quay.io/rockylinux/rockylinux:9-ubi-init
    command: /usr/sbin/init
    systemd: always
    privileged: true
    capabilities:
      - SYS_ADMIN
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
provisioner:
  name: ansible
  inventory:
    host_vars:
      base-el9:
        node_ip: 10.50.1.99
    group_vars:
      all:
        base_manage_network: false
        base_prefix: 24
        gateway: 10.50.1.254
        dns_server: 10.50.1.254
        platform_hosts:
          - ip: 10.50.1.11
            names: edge1.platform.lab edge1
          - ip: 10.50.1.31
            names: data1.platform.lab data1
        domain: platform.lab
        subnet: 10.50.1.0/24
        vip: 10.50.1.10
        webdata_uid: 1980
        webdata_gid: 1980
        tuned_profile: throughput-performance
        loki_port: 3100
  env:
    ANSIBLE_ROLES_PATH: ../../../../roles
verifier:
  name: ansible
