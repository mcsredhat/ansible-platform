---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Gather package facts
      ansible.builtin.package_facts:

    - name: Base packages are installed
      ansible.builtin.assert:
        that: "'chrony' in ansible_facts.packages and 'jq' in ansible_facts.packages"
        fail_msg: "expected base packages missing"

    - name: /etc/hosts rendered from the platform map
      ansible.builtin.command: grep -q "edge1.platform.lab" /etc/hosts
      changed_when: false

    - name: Hostname is readable (via /proc, no hostname binary needed)
      ansible.builtin.slurp:
        src: /proc/sys/kernel/hostname
      register: hn

    - name: Hostname is non-empty
      ansible.builtin.assert:
        that: (hn.content | b64decode | trim) | length > 0
        fail_msg: "hostname was not set"
