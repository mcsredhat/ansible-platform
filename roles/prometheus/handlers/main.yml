---
- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  when: not (prometheus_in_container | default(false))
- name: restart prometheus
  ansible.builtin.systemd:
    name: prometheus
    state: restarted
  when: not (prometheus_in_container | default(false))
- name: reload prometheus
  ansible.builtin.systemd:
    name: prometheus
    state: reloaded
  when: not (prometheus_in_container | default(false))
