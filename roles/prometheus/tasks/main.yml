---
# prometheus — central metrics server on obs1 (Phase 5)

- name: Detect container runtime
  ansible.builtin.set_fact:
    prometheus_in_container: "{{ ansible_facts['virtualization_type'] | default('') in
      ['docker', 'podman', 'container', 'lxc', 'containerd', 'oci'] }}"
  tags: always

- name: Create the prometheus system user
  ansible.builtin.user:
    name: "{{ prometheus_user }}"
    system: true
    shell: /sbin/nologin
    home: "{{ prometheus_data_dir }}"
    create_home: false
  tags: [prometheus, user]

- name: Create prometheus directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_user }}"
    mode: "0755"
  loop:
    - "{{ prometheus_config_dir }}"
    - "{{ prometheus_rules_dir }}"
    - "{{ prometheus_data_dir }}"
  tags: [prometheus, config]

- name: Download and extract prometheus
  ansible.builtin.unarchive:
    src: "{{ prometheus_download_url }}"
    dest: /tmp
    remote_src: true
    creates: "/tmp/prometheus-{{ prometheus_version }}.{{ prometheus_arch }}/prometheus"
  tags: [prometheus, install]

- name: Install prometheus binaries
  ansible.builtin.copy:
    src: "/tmp/prometheus-{{ prometheus_version }}.{{ prometheus_arch }}/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  loop:
    - prometheus
    - promtool
  notify: restart prometheus
  tags: [prometheus, install]

- name: Deploy the prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_dir }}/prometheus.yml"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_user }}"
    mode: "0644"
    validate: "/usr/local/bin/promtool check config %s"
  notify: reload prometheus
  tags: [prometheus, config]

- name: Deploy SLO recording + burn-rate rules
  ansible.builtin.template:
    src: slo-rules.yml.j2
    dest: "{{ prometheus_rules_dir }}/slo-rules.yml"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_user }}"
    mode: "0644"
    validate: "/usr/local/bin/promtool check rules %s"
  notify: reload prometheus
  tags: [prometheus, config, slo]

- name: Deploy alert rules
  ansible.builtin.template:
    src: alert-rules.yml.j2
    dest: "{{ prometheus_rules_dir }}/platform-alerts.yml"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_user }}"
    mode: "0644"
    validate: "/usr/local/bin/promtool check rules %s"
  notify: reload prometheus
  tags: [prometheus, rules]

- name: Deploy the prometheus systemd unit
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart prometheus
  tags: [prometheus, service]

- name: Enable and start prometheus
  ansible.builtin.systemd:
    name: prometheus
    state: started
    enabled: true
    daemon_reload: true
  when: not prometheus_in_container
  tags: [prometheus, service]

- name: Is firewalld running?
  ansible.builtin.command: systemctl is-active firewalld
  register: prometheus_firewalld
  changed_when: false
  failed_when: false
  tags: [prometheus, firewall]

- name: Allow the mgmt subnet to reach the Prometheus UI
  ansible.posix.firewalld:
    rich_rule: "rule family=ipv4 source address={{ prometheus_allowed_source }} port port={{ prometheus_port }} protocol=tcp accept"
    permanent: true
    immediate: "{{ prometheus_firewalld.stdout == 'active' }}"
    state: enabled
  when: not prometheus_in_container
  tags: [prometheus, firewall]
