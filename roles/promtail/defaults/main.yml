---
# promtail — ships journald (+ nginx logs on web/edge) to loki (Phase 5)
promtail_version: "3.1.1"
promtail_arch: "linux-amd64"
promtail_user: promtail
promtail_port: 9080

promtail_config_dir: /etc/promtail
promtail_positions_dir: /var/lib/promtail

promtail_loki_url: "http://obs1:{{ loki_port | default(3100) }}/loki/api/v1/push"

promtail_download_url: >-
  https://github.com/grafana/loki/releases/download/v{{ promtail_version }}/promtail-{{ promtail_arch }}.zip
