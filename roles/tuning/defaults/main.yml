---
# tuning role defaults — host-level performance (override in group_vars/host_vars)

# tuned profile (tuned_profile is set platform-wide in group_vars/all)
tuning_tuned: true
tuning_tuned_profile: "{{ tuned_profile | default('throughput-performance') }}"

# Transparent Huge Pages — disable (a known MariaDB/Redis performance footgun)
tuning_disable_thp: true

# file-descriptor / process limits (login sessions; services set their own in their roles)
tuning_limits: true
tuning_nofile_soft: 65535
tuning_nofile_hard: 65535
tuning_nproc_soft: 16384
tuning_nproc_hard: 16384

# performance sysctls (separate file from the security sysctls in hardening)
# Only what tuned does not manage: /etc/sysctl.d is reapplied after the profile
# (reapply_sysctl=1), so a key here overrides tuned. vm.* belongs to tuned;
# fs.file-max and net.core.somaxconn stay at the kernel default (higher).
tuning_sysctl: true
tuning_sysctl_settings:
  net.core.netdev_max_backlog: 5000
  net.ipv4.tcp_max_syn_backlog: 4096
  net.ipv4.tcp_fin_timeout: 15
  net.ipv4.tcp_tw_reuse: 1
  # Ephemeral range must stay above every listener, or an outbound connection
  # can take a service port before it binds. Platform listeners, all below 12000:
  # 22 25 53 80 110 143 443 465 587 993 995 2049 3000 3100 3306 6379 8080 8081
  # 9080 9090 9093 9096 9100 9104 9113 9115 9154 11332 11333 11334 (rspamd)
  # Keep the start even and the end odd (the kernel's preferred split).
  net.ipv4.ip_local_port_range: "12000 65535"
