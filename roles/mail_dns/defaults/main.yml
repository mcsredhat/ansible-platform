---
# mail_dns — BIND authoritative zone for the mail domain (Phase 7c)
# NOTE: for the lab this is authoritative internal DNS. For a PUBLIC domain you
# publish the same records at your registrar/Cloudflare instead of self-hosting BIND.
mail_dns_packages:
  - bind
  - bind-utils
mail_domain: "{{ domain }}"
mail_hostname: "mail.{{ mail_domain }}"
mail_server_ip: "192.168.1.51"        # mail1

# deliverability records
mail_spf_record: "v=spf1 mx -all"     # only our MX may send; hard-fail others
mail_dmarc_policy: "quarantine"       # none|quarantine|reject
mail_dmarc_rua: "postmaster@{{ mail_domain }}"
# DKIM public record is generated by rspamd; paste its value here once known:
mail_dkim_record: ""                  # e.g. 'v=DKIM1; k=rsa; p=MIGf...'
mail_dkim_selector: "mail"
