---
# =============================================================================
# ansible-platform CI (Phase 6)
# Self-hosted GitLab Runner (shell executor) on the homelab, tagged `homelab`.
# =============================================================================
stages:
  - lint
  - syntax
  - secrets
  - molecule

default:
  tags: [homelab]
  before_script:
    - source /root/.venv/ansible/bin/activate
    - echo "$ANSIBLE_VAULT_PASSWORD" > .vault-pass
    - chmod 600 .vault-pass

variables:
  ANSIBLE_FORCE_COLOR: "1"
  PY_COLORS: "1"

yamllint:
  stage: lint
  script:
    - yamllint .

ansible-lint:
  stage: lint
  script:
    - ansible-lint

syntax-check:
  stage: syntax
  script:
    - ansible-galaxy collection install -r requirements.yml
    - ansible-playbook site.yml --syntax-check
    - |
      for play in *.yml; do
        case "$play" in site.yml|requirements.yml) continue;; esac
        echo "--- syntax-check: $play"
        ansible-playbook "$play" --syntax-check
      done

secrets-scan:
  stage: secrets
  script:
    - scripts/ci/secrets-scan.sh

.molecule-base: &molecule-base
  stage: molecule
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - cd "roles/$ROLE"
    - molecule test

molecule:
  <<: *molecule-base
  parallel:
    matrix:
      - ROLE:
          - base
          - hardening
          - tuning
          - audit
          - fail2ban
          - mariadb
          - redis
          - nfs_server
          - nfs_client
          - nginx_common
          - nginx_edge
          - keepalived
          - node_exporter
          - restic_backup
          - prometheus
          - alertmanager
          - loki
          - grafana
          - blackbox_exporter
          - promtail
          - nginx_exporter
          - mysqld_exporter
          - secops

molecule-php_fpm:
  <<: *molecule-base
  allow_failure: true
  script:
    - cd roles/php_fpm
    - molecule test
